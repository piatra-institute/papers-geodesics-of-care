abstract: 'A system can improve its forecast of a person''s welfare while losing track of what that person
  wants. We use a small geometric model to separate three questions: how a represented condition changes,
  what an intervention costs, and who may authorize it. A prognosis over failing, coping and flourishing
  is placed on a probability simplex with the Fisher-Rao metric, which statistical invariance motivates
  but does not make compulsory for care. Worked calculations show how a conformal effort field changes
  path costs and curvature, and a flat counterexample shows that a costly detour carries no information
  by itself about delegating responsibility. The central ethical distinction concerns outcome entropy
  and recipient permission. A freely chosen predictable outcome can have zero entropy, and an imposed
  lottery can have high entropy, so an entropy floor constrains uncertainty and leaves autonomy unaddressed.
  With assigned utility weights, the floor''s calculated cost is 0.1521, and a different choice of weights
  removes the cost entirely. A separate permission rule lets the recipient refuse, revoke or change a
  target, including when the new target scores worse for the controller. All results are deterministic
  illustrations and implementation checks with no observations of caring practice. They make the model''s
  commitments inspectable and prevent a welfare score from standing in for the recipient''s own instruction.'
web_blurb: A Fisher-Rao model of prognosis separates outcome forecasts, intervention costs and recipient
  permission. An entropy floor constrains uncertainty without protecting autonomy, while a permission
  rule lets the recipient refuse, revoke or change a target.
