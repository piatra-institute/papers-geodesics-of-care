    {
      "id": "abstract-floor-cost",
      "kind": "computation",
      "passage": "A system may improve its forecast of someone's welfare while losing sight of what that person wants. This paper uses a small geometric model to distinguish three questions: how a represented condition changes, what an intervention costs, and who may authorize it. A prognosis over failing, coping and flourishing is placed on a probability simplex with the Fisher-Rao metric. Statistical invariance motivates this metric; it does not make it compulsory for care. Worked calculations show how a conformal effort field changes path costs and curvature, while a flat counterexample shows why a costly detour says nothing by itself about delegating responsibility. The main ethical distinction appears when outcome entropy is compared with recipient permission. A freely chosen predictable outcome can have zero entropy; an imposed lottery can have high entropy. An entropy floor therefore constrains uncertainty, not autonomy. With assigned utility weights, its calculated cost is 0.1521; changing the weights can remove that cost entirely. A separate permission rule lets the recipient refuse, revoke or change a target, including when the new target scores worse for the controller. These are deterministic illustrations and implementation checks, not observations of caring practice. Their value is to make the model's commitments inspectable without allowing a welfare score to speak for its recipient.",
